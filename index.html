<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7efe8" />
  <title>La música del bautizo de Allison</title>
  <style>
    :root {
      --bg: #f7efe8;
      --card: rgba(255,255,255,.94);
      --text: #56483f;
      --muted: #8d7b70;
      --accent: #c79f84;
      --spotify: #1ed760;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #fffdfa 0%, var(--bg) 60%, #efe2d8 100%);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .card {
      width: min(100%, 430px);
      padding: 46px 28px 34px;
      background: var(--card);
      border: 1px solid #eadbd0;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(83, 63, 49, .14);
      backdrop-filter: blur(8px);
    }

    .cross {
      color: var(--accent);
      font-size: 30px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(42px, 12vw, 58px);
      line-height: 1;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: var(--accent);
      font: 600 14px/1.2 Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .message {
      margin: 0 0 28px;
      font: 17px/1.55 Arial, sans-serif;
    }

    .button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 999px;
      background: var(--spotify);
      color: #111;
      font: 700 17px/1 Arial, sans-serif;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(30, 215, 96, .25);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .65;
      box-shadow: none;
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      background: #fbf6f2;
      font: 14px/1.45 Arial, sans-serif;
      color: var(--muted);
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font: 12px/1.4 Arial, sans-serif;
    }

    .tiny-link {
      display: inline-block;
      margin-top: 24px;
      color: #b5a49a;
      font: 11px Arial, sans-serif;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cross" aria-hidden="true">✝</div>
    <h1>Allison</h1>
    <div class="subtitle">Mi bautizo</div>

    <p class="message">
      Ayúdanos a ponerle música a la celebración.
      Agrega tu canción favorita a la fila.
    </p>

    <button id="joinButton" class="button" type="button" disabled>
      Cargando…
    </button>

    <div id="status" class="status" role="status"></div>

    <div class="note">
      Al continuar, se abrirá Spotify.
    </div>

    <a class="tiny-link" href="./admin.html">Administrar</a>
  </main>

  <script>
    const button = document.getElementById("joinButton");
    const statusBox = document.getElementById("status");
    let jamUrl = "";

    function showStatus(message) {
      statusBox.textContent = message;
      statusBox.style.display = "block";
    }

    async function loadJam() {
      try {
        const response = await fetch(`./jam.json?t=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("No se pudo leer la configuración.");
        }

        const data = await response.json();
        jamUrl = typeof data.url === "string" ? data.url.trim() : "";

        if (!jamUrl) {
          button.textContent = "🎵 El Jam aún no comienza";
          button.disabled = true;
          showStatus("Vuelve a escanear este código cuando empiece la celebración.");
          return;
        }

        if (!/^https:\/\/(spotify\.link|open\.spotify\.com)\//i.test(jamUrl)) {
          throw new Error("El enlace configurado no parece ser de Spotify.");
        }

        button.textContent = "🎵 Unirme al Spotify Jam";
        button.disabled = false;
      } catch (error) {
        button.textContent = "No disponible";
        button.disabled = true;
        showStatus(error.message || "Ocurrió un problema al cargar el Jam.");
      }
    }

    button.addEventListener("click", () => {
      if (jamUrl) {
        window.location.assign(jamUrl);
      }
    });

    loadJam();
  </script>
</body>
</html>
